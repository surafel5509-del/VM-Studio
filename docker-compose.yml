# FRAMEFORGE STUDIO — local dev / self-host composition.
# Requires: Supabase project (external) or a local Postgres — see docs/deployment.md.
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    env_file:
      - .env.local
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on: []

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    env_file:
      - apps/mcp-server/.env.local
    environment:
      PORT: 4321
      HOST: 0.0.0.0
    ports:
      - "4321:4321"
    depends_on: []
